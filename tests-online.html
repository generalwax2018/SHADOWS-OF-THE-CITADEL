<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>running...</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; background: #111; color: #ddd; padding: 20px; max-width: 820px; margin: auto; }
  .pass { color: #7bc67b; } .fail { color: #ff7777; font-weight: bold; }
</style>
</head>
<body>
<h1>Online mode tests</h1>
<div id="out"></div>
<script src="js/engine.js"></script>
<script src="js/net.js"></script>
<script src="js/online.js"></script>
<script>
// Host and guest live in the same page and talk over a real RTCPeerConnection (loopback, no STUN).
const C = window.Citadel, N = window.CitadelNet, O = window.CitadelOnline;
const out = document.getElementById('out');
let passed = 0, failed = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(fn, ms, label) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { if (fn()) return; await sleep(25); }
  throw new Error('timed out waiting for ' + (label || 'condition'));
}
async function test(name, fn) {
  try { await fn(); passed++; out.insertAdjacentHTML('beforeend', `<div class="pass">PASS ${name}</div>`); }
  catch (e) { failed++; out.insertAdjacentHTML('beforeend', `<div class="fail">FAIL ${name}: ${e.message}</div>`); }
}
function ok(c, m) { if (!c) throw new Error(m || 'expected truthy'); }
function eq(a, b, m) { if (a !== b) throw new Error(`${m || 'eq'}: expected ${b}, got ${a}`); }

// Connect one guest to a host; resolves when the data channel is open on both ends.
async function connect(host, name) {
  const { seat, code } = await host.invite();
  const guest = new O.Guest({ name, lanOnly: true });
  const reply = await guest.join(code);
  await host.accept(seat, reply);
  await waitFor(() => host.seats[seat].kind === 'human' && guest.connected, 15000, 'peer connection');
  return { seat, guest };
}

(async function run() {
  await test('codes round-trip and reject junk', async () => {
    const code = await N.pack({ t: 'o', s: 'v=0\r\n' + 'a=candidate:1 1 udp 2122260223 192.168.1.5 5000 typ host\r\n'.repeat(20) });
    ok(code.startsWith('SOC1.'), 'prefix');
    const back = await N.unpack('  ' + code.slice(0, 40) + '\n' + code.slice(40) + '  ');
    eq(back.t, 'o'); ok(back.s.includes('192.168.1.5'));
    let threw = 0;
    for (const bad of ['', 'hello', 'SOC1.', 'SOC1.1@@@@', code.slice(0, code.length - 15)]) { try { await N.unpack(bad); } catch (e) { threw++; } }
    eq(threw, 5, 'all junk rejected');
  });

  let host, g1, seat1;
  await test('a guest connects to the host over WebRTC', async () => {
    ok(N.supported(), 'WebRTC supported');
    host = new O.Host({ size: 3, difficulty: 'normal', seed: 12345, name: 'Hosty', botDelay: 5, lanOnly: true });
    const c = await connect(host, 'Gwen');
    g1 = c.guest; seat1 = c.seat;
    eq(host.seats[seat1].kind, 'human');
    await waitFor(() => host.seats[seat1].name === 'Gwen', 3000, 'guest name');
    await waitFor(() => g1.lobby && g1.lobby.you === seat1, 3000, 'lobby message');
    eq(g1.lobby.seats.length, 3);
  });

  await test('the game starts; the guest gets only a redacted view', async () => {
    host.start();
    await waitFor(() => g1.view, 5000, 'guest view');
    const v = g1.view;
    eq(v.viewer, seat1);
    eq(v.rng, 0, 'rng hidden'); eq(v.seed, 0, 'seed hidden');
    ok(v.whiteDeck.every(c => c === 0), 'white deck hidden');
    const traitor = host.game.traitor;
    if (traitor === seat1) eq(v.traitor, traitor, 'the Traitor knows');
    else eq(v.traitor, -1, 'traitor hidden');
    if (traitor !== seat1) ok(!JSON.stringify(v).includes('"traitor":' + traitor) || traitor === -1, 'no leak');
    eq(host.game.traitorHuman, host.seats[traitor].kind !== 'bot', 'human traitor flag');
  });

  await test('guest actions are refused out of turn and for unknown/malformed requests', async () => {
    // wait until it is NOT the guest\'s turn, then try to act
    await waitFor(() => host.game.over || host.game.active !== seat1, 15000, 'a turn that is not the guest\'s');
    let result = null;
    g1.on('result', m => { result = m; });
    g1.act('drawAction', []);
    await waitFor(() => result, 3000, 'result message');
    ok(!result.ok, 'refused: ' + result.msg);
    result = null; g1.act('startGame', []); await waitFor(() => result, 3000);
    ok(!result.ok, 'unknown action refused');
    result = null; g1.act('move', ['__proto__']); await waitFor(() => result, 3000);
    ok(!result.ok, 'bad args refused');
    result = null; g1.act('contribute', [[1, 2, 3, 4, 5]]); await waitFor(() => result, 3000);
    ok(!result.ok, 'oversized args refused');
  });

  // The host here is a human who isn't playing, so pass their turn while waiting for another seat.
  async function advanceTo(seat, ms) {
    const t0 = Date.now();
    while (!host.game.over && host.game.active !== seat && Date.now() - t0 < (ms || 20000)) {
      if (host.game.active === 0) host.act('endTurn', []);
      await sleep(15);
    }
    return host.game.active === seat;
  }

  await test('bots play the empty seats and the guest gets its turn', async () => {
    const botSeat = [0, 1, 2].find(i => i !== 0 && i !== seat1);
    eq(host.seats[botSeat].kind, 'bot', 'the third seat is a bot');
    const botTurns = host.game.log.filter(l => l.cls === 'turn').length;
    ok(await advanceTo(seat1) || host.game.over, 'reached the guest turn');
    ok(host.game.log.filter(l => l.cls === 'turn').length > botTurns, 'turns passed');
    ok(host.game.log.some(l => /Bot/.test(l.text)) || true);
  });

  await test('guest acts on its own turn; the new state reaches the host', async () => {
    if (host.game.over) return;
    await advanceTo(seat1);
    await waitFor(() => host.game.active === seat1 && g1.view && g1.view.active === seat1, 10000, 'sync');
    const turnBefore = host.game.turn;
    let result = null;
    g1.on('result', m => { result = m; });
    g1.act('drawAction', []);
    await waitFor(() => result, 3000, 'result');
    ok(result.ok, 'draw accepted: ' + result.msg);
    g1.act('endTurn', []);
    await waitFor(() => host.game.turn > turnBefore || host.game.over, 5000, 'turn advanced');
    ok(true);
  });

  await test('someone else cannot act on the host\'s turn through the guest channel', async () => {
    if (host.game.over) return;
    await waitFor(() => host.game.over || host.game.active === 0, 25000, 'host turn');
    if (host.game.over) return;
    await sleep(50);
    const before = JSON.stringify(host.game.party[0].hand);
    let result = null;
    g1.on('result', m => { result = m; });
    g1.act('endTurn', []);
    await waitFor(() => result, 3000);
    ok(!result.ok && host.game.active === 0, 'guest cannot end the host\'s turn');
    eq(JSON.stringify(host.game.party[0].hand), before);
  });

  await test('the host acts through the same path', async () => {
    if (host.game.over) return;
    await waitFor(() => host.game.over || host.game.active === 0, 25000, 'host turn');
    if (host.game.over) return;
    const r = host.act('drawAction', []);
    ok(r.ok, r.msg);
    ok(!host.act('drawAction', ['x']).ok, 'bad args refused for host too');
  });

  await test('a whole game can be finished by host + bots + guest through the protocol', async () => {
    let guard = 0;
    while (!host.game.over && guard++ < 4000) {
      const g = host.game;
      if (g.active === 0) { const h = C.suggest(g); if (h && h.type === 'play') host.act('contribute', [h.cards]); else if (h && h.type === 'move') host.act('move', [h.dest]); else if (h && h.type === 'draw') host.act('drawAction', []); else host.act('endTurn', []); if (host.game.active === 0 && host.game.actionsLeft <= 0) host.act('endTurn', []); }
      else if (g.active === seat1) { g1.act('endTurn', []); }
      await sleep(2);
    }
    ok(host.game.over, 'game finished');
    await waitFor(() => g1.view && g1.view.over, 5000, 'guest sees the ending');
    ok(g1.view.over.reason.length > 3);
    ok(g1.view.traitor >= 0, 'traitor revealed at the end');
    eq(g1.view.seed, host.game.seed, 'seed shared at the end');
  });

  await test('a dropped guest becomes a bot', async () => {
    const h2 = new O.Host({ size: 3, seed: 77, botDelay: 5, lanOnly: true });
    const c = await connect(h2, 'Dropper');
    let left = null; h2.on('left', (s, n) => { left = [s, n]; });
    h2.start();
    c.guest.close();
    await waitFor(() => left, 15000, 'drop detected');
    ok(h2.seats[c.seat].kind === 'bot' && /bot/i.test(h2.seats[c.seat].name));
    h2.close();
  });

  await test('a dropped player can rejoin the running game and gets their seat back', async () => {
    const h3 = new O.Host({ size: 3, seed: 78, botDelay: 5, lanOnly: true, name: 'Hosty' });
    const c = await connect(h3, 'Rita');
    let left = null; h3.on('left', (s, n) => { left = [s, n]; });
    h3.start();
    c.guest.close();
    await waitFor(() => left, 15000, 'drop detected');
    ok(h3.seats[c.seat].dropped === true, 'the seat is marked as left');
    ok(h3.openSeat() === c.seat, 'the seat that left is offered first');
    // the host invites that seat again, mid-game
    let g2 = null, started = null;
    const inv = await h3.invite({ seat: c.seat });
    eq(inv.seat, c.seat, 'same seat');
    eq(h3.seats[c.seat].kind, 'pending', 'pending while the code is answered');
    const guest = new O.Guest({ name: 'Rita', lanOnly: true });
    guest.on('start', v => { started = v; });
    const reply = await guest.join(inv.code);
    await h3.accept(inv.seat, reply);
    await waitFor(() => started, 15000, 'start message after rejoining');
    eq(h3.seats[c.seat].kind, 'human', 'a human again');
    ok(!/bot/i.test(h3.seats[c.seat].name), 'no longer called a bot');
    eq(started.viewer, c.seat, 'redacted view for that seat');
    eq(guest.seat, c.seat, 'guest knows its seat');
    // a cancelled mid-game invite puts the bot back
    const inv2 = await h3.invite({ seat: (c.seat === 1 ? 2 : 1) });
    h3.cancelInvite(inv2.seat);
    eq(h3.seats[inv2.seat].kind, 'bot', 'cancelling restores the bot');
    guest.close(); h3.close();
  });

  await test('a human Traitor\'s plot is private: no one else receives anything, and names cannot change mid-game', async () => {
    const h4 = new O.Host({ size: 4, seed: 4242, botDelay: 5, lanOnly: true, name: 'Hosty' });
    const a = await connect(h4, 'Ana'), b = await connect(h4, 'Bo');
    await waitFor(() => h4.seats[a.seat].name === 'Ana' && h4.seats[b.seat].name === 'Bo', 3000, 'names');
    h4.start();
    const g = h4.game;
    g.traitor = a.seat; g.traitorHuman = true; g.plot = null;         // make Ana the Traitor for this test
    // a second hello must not rename anyone
    a.guest.peer.send({ t: 'hello', name: 'Impostor' });
    await sleep(150);
    eq(h4.seats[a.seat].name, 'Ana', 'a second hello is ignored');
    // walk to Ana's turn
    const t0 = Date.now();
    while (g.active !== a.seat && !g.over && Date.now() - t0 < 20000) { if (g.active === 0) h4.act('endTurn', []); else if (g.active === b.seat) b.guest.act('endTurn', []); await sleep(20); }
    if (g.over) return;
    await waitFor(() => a.guest.view && a.guest.view.active === a.seat, 5000, 'Ana sees her turn');
    let bMsgs = 0, hostStates = 0, result = null;
    b.guest.on('state', () => { bMsgs++; });
    h4.on('state', () => { hostStates++; });
    a.guest.on('result', m => { if (m.name === 'sabotageAction') result = m; });
    const logLen = g.log.length, actions = g.actionsLeft;
    a.guest.act('sabotageAction', [C.CITADEL]);
    await waitFor(() => result, 3000, 'plot result');
    ok(result.ok, 'plot accepted: ' + result.msg);
    await waitFor(() => a.guest.view.plot, 3000, 'the Traitor sees the plot');
    await sleep(200);
    eq(bMsgs, 0, 'the other guest received nothing');
    eq(hostStates, 0, 'the host UI was not told either');
    eq(g.log.length, logLen, 'nothing public was logged');
    eq(g.actionsLeft, actions, 'no action spent');
    ok(b.guest.view.plot === undefined, 'the other guest\'s view has no plot');
    // dropping the Traitor hands their part to a bot
    a.guest.close();
    await waitFor(() => h4.seats[a.seat].kind === 'bot', 15000, 'drop');
    eq(g.traitorHuman, false, 'a bot now plays the Traitor');
    b.guest.close(); h4.close();
  });

  await test('players choose their defenders in the lobby; a clash goes to the earlier seat', async () => {
    const h7 = new O.Host({ size: 4, seed: 515, botDelay: 5, lanOnly: true, name: 'Hosty', pick: 'mage' });
    const a = await connect(h7, 'Ada'); a.guest.pick = null;
    await waitFor(() => h7.seats[a.seat].name === 'Ada', 3000, 'name');
    const gB = new O.Guest({ name: 'Ben', lanOnly: true, pick: 'mage' });       // asks for the host's defender
    const inv = await h7.invite(); const rep = await gB.join(inv.code); await h7.accept(inv.seat, rep);
    await waitFor(() => h7.seats[inv.seat].name === 'Ben', 15000, 'Ben joins');
    const gC = new O.Guest({ name: 'Cy', lanOnly: true, pick: 'shield' });
    const inv2 = await h7.invite(); const rep2 = await gC.join(inv2.code); await h7.accept(inv2.seat, rep2);
    await waitFor(() => h7.seats[inv2.seat].name === 'Cy', 15000, 'Cy joins');
    await waitFor(() => gC.lobby && gC.lobby.seats[inv2.seat].pick === 'shield', 3000, 'the lobby shows the choice');
    h7.start();
    eq(h7.game.party[0].id, 'mage', 'the host plays the Mage-Knight');
    ok(h7.game.party[inv.seat].id !== 'mage', 'Ben, who asked second, is dealt another');
    eq(h7.game.party[inv2.seat].id, 'shield', 'Cy plays the Shield-Bearer');
    eq(new Set(h7.game.party.map(p => p.id)).size, 4, 'no defender twice');
    await waitFor(() => gC.view, 5000, 'Cy gets the view');
    let r = null; gC.on('result', m => { if (m.name === 'feat') r = m; }); gC.act('feat', [-1]);
    await waitFor(() => r, 3000, 'feat result'); ok(!r.ok, 'a Feat is refused out of turn');
    a.guest.close(); gB.close(); gC.close(); h7.close();
  });

  await test('a host can resume a saved game; friends\' seats wait for them as dropped bots', async () => {
    const h5 = new O.Host({ size: 3, seed: 99, botDelay: 5, lanOnly: true, name: 'Hosty' });
    const c = await connect(h5, 'Cass');
    h5.start();
    const snap = JSON.parse(JSON.stringify(h5.snapshot()));
    ok(snap && snap.game && snap.seats.length === 3, 'snapshot taken');
    eq(snap.seats[c.seat].kind, 'human', 'the friend is remembered');
    c.guest.close(); h5.close();
    const h6 = new O.Host({ size: snap.size, difficulty: snap.difficulty, botDelay: 5, lanOnly: true, name: 'Hosty' });
    h6.resume(snap.game, snap.seats);
    ok(h6.game && h6.game.turn === snap.game.turn, 'the same game carries on');
    eq(h6.seats[c.seat].kind, 'bot', 'a bot holds the seat');
    ok(h6.seats[c.seat].dropped && /Cass/.test(h6.seats[c.seat].name), 'marked as waiting for Cass');
    eq(h6.openSeat(), c.seat, 'and it is offered first on Invite / rejoin');
    eq(h6.game.traitorHuman, h6.game.traitor === 0, 'only the host can be a human Traitor until friends rejoin');
    h6.close();
  });
  host.close();
  document.title = `${passed} passed, ${failed} failed`;
  out.insertAdjacentHTML('beforeend', `<h2 id="summary">${passed} passed, ${failed} failed</h2>`);
})();
</script>
</body>
</html>
