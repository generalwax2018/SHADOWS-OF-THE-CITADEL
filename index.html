<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadows of the Citadel</title>
<meta name="description" content="A cooperative board game of siege and betrayal. Hold the Citadel, finish the quests, and unmask the Traitor.">
<meta name="theme-color" content="#080605">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Shadows of the Citadel">
<meta property="og:description" content="A cooperative board game of siege and betrayal. Hold the Citadel, finish the quests, and unmask the Traitor.">
<meta property="og:image" content="https://generalwax2018.github.io/SHADOWS-OF-THE-CITADEL/assets/social.jpg">
<meta property="og:url" content="https://generalwax2018.github.io/SHADOWS-OF-THE-CITADEL/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="assets/board.webp" as="image" type="image/webp">
<link rel="stylesheet" href="css/style.css?v=20261123d">
</head>
<body>
<noscript><p style="margin:0;padding:24px;text-align:center;color:#e8e0d0;background:#14100c">Shadows of the Citadel needs JavaScript. Please turn it on for this site and reload.</p></noscript>

<header class="topbar">
  <h1 class="has-logo"><img class="logo-img" src="assets/ui/logo.webp" alt="Shadows of the Citadel"></h1>
  <div class="status" aria-live="polite">
    <span class="chip" title="Rounds played">Round <strong id="round">1</strong></span>
    <span class="chip white" title="Seven white swords wins">White <strong id="white">0</strong>/7</span>
    <span class="chip black" title="Six black swords loses">Black <strong id="black">0</strong>/6</span>
    <span class="chip siege" title="Twelve siege engines loses">Siege <strong id="siege">0</strong>/12</span>
    <span class="chip weather" id="weatherLabel">Clear</span>
    <span class="chip net" id="netChip" hidden></span>
  </div>
  <div class="topbtns">
    <button id="btnSound" class="ghost" aria-pressed="true">Sound: on</button>
    <button id="btnSettings" class="ghost">Settings</button>
    <button id="btnRules" class="ghost">Rules</button>
    <button id="btnFeedback" class="ghost">Feedback</button>
    <button id="btnInvite" class="ghost" hidden title="Invite a friend or bring someone back into this game">Invite / rejoin</button>
    <button id="btnNew" class="ghost">New game</button>
  </div>
</header>

<main class="layout">
  <section class="stage-wrap" aria-label="Game board">
    <div class="stage" id="stage">
      <img class="board-img" src="assets/board.webp" alt="The Citadel war table" draggable="false">
      <div class="overlay" id="overlay">
        <div class="siege-row" id="siegeRow" aria-hidden="true"></div>
        <div class="wheel" id="wheel" aria-hidden="true"></div>
        <div class="deck-label shadow-deck" id="shadowDeck" title="Shadow deck: one card is drawn at the start of every turn"></div>
        <div class="citadel-spot" id="citadelSpot" role="button" tabindex="0" aria-label="The Citadel">
          <span class="spot-name">The Citadel</span>
          <div class="tokens" id="tokens-citadel"></div>
        </div>
        <div class="slots" id="slots"></div>
        <div class="board-missions" id="boardMissions" aria-label="Missions"></div>
        <canvas class="weather-canvas" id="weatherCanvas"></canvas>
        <div class="dim" id="dim"></div>
      </div>
      <div class="exp" id="expedition" role="region" aria-label="Mission view"></div>
      <div class="hurt" id="hurt" aria-hidden="true"></div>
      <div class="banner" id="banner" aria-live="polite"></div>
      <div class="shadow-reveal" id="shadowReveal" aria-hidden="true"></div>
      <div class="chronicle" id="chronicle" aria-live="polite"></div>
      <div class="toasts" id="toasts" aria-hidden="true"></div>
    </div>

    <h2 class="missions-title">Path of destruction <small>every Shadow card so far; the fire creeps toward the Citadel</small></h2>
    <div class="trail" id="trail" role="list" aria-label="Shadow cards drawn so far"></div>

  </section>

  <section class="missions-wrap" aria-label="Missions">
    <h2 class="missions-title">Missions <small>deadline, favoured suit, progress. Select one to inspect it</small></h2>
    <div class="missions" id="missions" role="list"></div>
  </section>

  <aside class="side">
    <section class="panel active-panel" id="activePanel"></section>

    <section class="panel quest-list-panel">
      <h2>Quests <small>tap for details</small></h2>
      <div id="questList"></div>
    </section>

    <section class="panel">
      <h2>Hand <small id="handHint"></small></h2>
      <div class="hand" id="hand"></div>
      <div class="powers" id="powers" aria-label="Suit powers: play two cards of one suit to trigger it"></div>
    </section>

    <section class="panel">
      <h2>Actions <small id="actionsLeft"></small></h2>
      <div class="coach" id="coach" hidden></div>
      <div class="actions" id="actions"></div>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <section class="panel tabs-panel">
      <div class="tabbar" role="tablist">
        <button type="button" role="tab" class="sel" data-tab="party" aria-selected="true">Defenders</button>
        <button type="button" role="tab" data-tab="rumors" aria-selected="false">Rumors <i id="rumorDot" class="dot" hidden></i></button>
        <button type="button" role="tab" data-tab="log" aria-selected="false">Chronicle</button>
      </div>
      <div class="tabpane" data-pane="party"><div class="party" id="party"></div></div>
      <div class="tabpane" data-pane="rumors" hidden><p class="muted-note">Who was near each sabotage</p><div id="rumors" class="rumors"></div></div>
      <div class="tabpane" data-pane="log" hidden><div class="log" id="log" aria-live="polite"></div></div>
    </section>
  </aside>
</main>

<!-- quest detail / modals -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal-card" id="modalCard"></div>
</div>

<script src="js/engine.js?v=20261123d"></script>
<script src="js/fx.js?v=20261123d"></script>
<script src="js/missions.js?v=20261123d"></script>
<script src="js/ambience.js?v=20261123d"></script>
<script src="js/sound.js?v=20261123d"></script>
<script src="js/net.js?v=20261123d"></script>
<script src="js/online.js?v=20261123d"></script>
<script src="js/ui.js?v=20261123d"></script>
</body>
</html>
