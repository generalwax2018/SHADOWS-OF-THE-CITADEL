<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadows of the Citadel</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050403; color: #e8e0d0; font-family: system-ui, sans-serif; overflow: hidden; }
  header {
    position: relative; z-index: 10;
    background: linear-gradient(180deg, #1a1510ee, #0c0a08ee);
    padding: 10px 20px; border-bottom: 2px solid #c9a66b;
    display: flex; justify-content: space-between; align-items: center;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 5px; color: #c9a66b; }
  .status { display: flex; gap: 18px; font-size: 14px; }
  .status strong { color: #c9a66b; }
  .main { display: flex; height: calc(100vh - 52px); }
  .board-wrap { flex: 1; position: relative; overflow: hidden; background: #111; }
  .board-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .panels-row {
    position: absolute; top: 8%; left: 4%; right: 4%;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; z-index: 3;
  }
  .panel-box {
    width: 130px; height: 170px; border-radius: 6px; overflow: hidden;
    border: 4px solid #2a2218; position: relative; background: #1a1510;
  }
  .panel-box canvas.weather { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .panel-box .label {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    background: rgba(0,0,0,0.75); font-size: 11px; text-align: center; padding: 5px;
  }
  .side-panel { width: 340px; background: #16120ee8; border-left: 1px solid #3a2f22; padding: 14px; overflow-y: auto; }
  .panel { background: #1e1a16; border: 1px solid #3a2f22; padding: 12px; margin-bottom: 12px; border-radius: 6px; }
  .panel h3 { margin: 0 0 8px; color: #c9a66b; font-size: 14px; }
  button {
    background: #3a2f22; color: #e8e0d0; border: 1px solid #c9a66b;
    padding: 7px 12px; margin: 3px 3px 3px 0; cursor: pointer; border-radius: 3px;
  }
  button:hover:not(:disabled) { background: #4a3f32; }
  button:disabled { opacity: 0.35; }
  .hand { display: flex; flex-wrap: wrap; gap: 6px; min-height: 70px; }
  .card { width: 50px; height: 72px; border-radius: 4px; border: 2px solid #c9a66b; background: #222; }
  .log { height: 110px; overflow-y: auto; background: #0a0806; padding: 8px; font-size: 12px; border-radius: 4px; }
  .win { color: #7bc67b; } .lose { color: #d46a6a; }

  .defenders { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .defender {
    width: 58px; height: 86px; position: relative; cursor: pointer;
    border-radius: 4px; overflow: hidden; border: 2px solid #444;
  }
  .defender img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    animation: breathe 4s ease-in-out infinite;
    transform-origin: center bottom;
  }
  .defender:nth-child(2n) img { animation-delay: -1.5s; }
  .defender:nth-child(3n) img { animation-delay: -2.8s; }
  .defender .blink {
    position: absolute; top: 22%; left: 18%; right: 18%; height: 8%;
    background: #1a1510; border-radius: 2px; opacity: 0;
    animation: blink 6s infinite;
  }
  .defender:nth-child(2) .blink { animation-delay: 1.2s; }
  .defender:nth-child(3) .blink { animation-delay: 2.4s; }
  .defender:nth-child(4) .blink { animation-delay: 0.8s; }
  .defender:nth-child(5) .blink { animation-delay: 3.1s; }
  .defender:nth-child(6) .blink { animation-delay: 1.8s; }
  .defender:nth-child(7) .blink { animation-delay: 2.6s; }
  .defender .glow {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 12px rgba(201,166,107,0.0);
    animation: glowPulse 5s ease-in-out infinite;
  }
  .defender:hover img { animation-play-state: paused; filter: brightness(1.15); }

  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.015) translateY(-1px); }
  }
  @keyframes blink {
    0%, 92%, 100% { opacity: 0; }
    94%, 96% { opacity: 1; }
  }
  @keyframes glowPulse {
    0%, 100% { box-shadow: inset 0 0 8px rgba(201,166,107,0.05); }
    50% { box-shadow: inset 0 0 16px rgba(201,166,107,0.25); }
  }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.show { display: flex; }
  .modal-content { background: #1a1510; padding: 24px; border: 2px solid #c9a66b; border-radius: 8px; text-align: center; max-width: 400px; }
</style>
</head>
<body>

<header>
  <h1>SHADOWS OF THE CITADEL</h1>
  <div class="status">
    <span>Turn <strong id="turn">1</strong></span>
    <span>White <strong id="white">0</strong></span>
    <span>Black <strong id="black">0</strong></span>
    <span>Siege <strong id="siege">0</strong>/12</span>
    <span id="phase">Progression</span>
  </div>
</header>

<div class="main">
  <div class="board-wrap">
    <div class="board-bg" id="boardBg"></div>
    <div class="panels-row" id="questSlots"></div>
  </div>

  <div class="side-panel">
    <div class="panel">
      <h3>Your Hand</h3>
      <div class="hand" id="hand"></div>
    </div>
    <div class="panel">
      <h3>Actions</h3>
      <button id="btnProgress" onclick="doProgress()">Progression of Evil</button>
      <button id="btnPlay" onclick="doHeroic('play')" disabled>Play Cards</button>
      <button id="btnDraw" onclick="doHeroic('draw')" disabled>Draw 2 White</button>
    </div>
    <div class="panel">
      <h3>Defenders</h3>
      <div class="defenders" id="defenders"></div>
    </div>
    <div class="panel">
      <h3>Log</h3>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button onclick="closeModal()">Continue</button>
  </div>
</div>

<script>
const defenderData = [
  { name: "Captain Veyra", color: "#8b5a2b" },
  { name: "Lord Harren", color: "#4a5a6a" },
  { name: "Scout Elira", color: "#5a6a4a" },
  { name: "Berserker", color: "#6a3a2a" },
  { name: "Mage-Knight", color: "#3a4a6a" },
  { name: "Cavalry Captain", color: "#5a4a3a" },
  { name: "Shield-Bearer", color: "#4a4a4a" }
];

function buildDefenders() {
  const el = document.getElementById("defenders");
  el.innerHTML = "";
  defenderData.forEach((d, i) => {
    const div = document.createElement("div");
    div.className = "defender";
    div.title = d.name;
    div.innerHTML = `
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='120'><rect fill='${encodeURIComponent(d.color)}' width='80' height='120'/><circle cx='40' cy='38' r='16' fill='%23e8e0d0'/><rect x='28' y='58' width='24' height='40' fill='%23c9a66b'/></svg>" alt="${d.name}">
      <div class="blink"></div>
      <div class="glow"></div>
    `;
    el.appendChild(div);
  });
}

const panelCanvases = [];
let weather = "rain";
function createPanelWeather(container) {
  const c = document.createElement("canvas");
  c.className = "weather";
  container.appendChild(c);
  const ctx = c.getContext("2d");
  const pc = { canvas: c, ctx, drops: [], w: 130, h: 170 };
  function resize() {
    const r = container.getBoundingClientRect();
    pc.w = c.width = r.width; pc.h = c.height = r.height;
  }
  resize();
  for (let i = 0; i < 18; i++) {
    pc.drops.push({
      x: Math.random()*pc.w, y: Math.random()*pc.h,
      vy: 1.2 + Math.random()*0.8, len: 6+Math.random()*6, a: 0.3+Math.random()*0.3
    });
  }
  panelCanvases.push(pc);
}
function weatherLoop() {
  panelCanvases.forEach(pc => {
    pc.ctx.clearRect(0,0,pc.w,pc.h);
    if (weather === "clear") return;
    pc.drops.forEach(d => {
      d.y += d.vy;
      if (d.y > pc.h) d.y = -10;
      pc.ctx.beginPath();
      pc.ctx.moveTo(d.x, d.y);
      pc.ctx.lineTo(d.x, d.y - d.len);
      pc.ctx.strokeStyle = `rgba(200,215,235,${d.a})`;
      pc.ctx.lineWidth = 1;
      pc.ctx.stroke();
    });
  });
  requestAnimationFrame(weatherLoop);
}

const quests = [
  { name:"Hold the Pass", progress:0, needed:4 },
  { name:"Recover the Banner", progress:0, needed:5 },
  { name:"Seek the Relic Blade", progress:0, needed:6 },
  { name:"Defend the Walls", progress:0, needed:4 }
];
let state = {
  turn:1, whiteSwords:0, blackSwords:0, siege:0,
  phase:"progress", hand:[],
  isTraitor: Math.random()<0.25, traitorRevealed:false,
  gameOver:false, selectedQuest:null
};

function log(msg, cls="") {
  const el=document.getElementById("log");
  const d=document.createElement("div");
  if(cls) d.className=cls;
  d.textContent=msg; el.appendChild(d); el.scrollTop=el.scrollHeight;
}
function updateUI() {
  document.getElementById("turn").textContent=state.turn;
  document.getElementById("white").textContent=state.whiteSwords;
  document.getElementById("black").textContent=state.blackSwords;
  document.getElementById("siege").textContent=state.siege;
  document.getElementById("phase").textContent=state.phase==="progress"?"Progression":"Heroic";
  document.getElementById("btnProgress").disabled=state.phase!=="progress"||state.gameOver;
  ["btnPlay","btnDraw"].forEach(id=>document.getElementById(id).disabled=state.phase!=="heroic"||state.gameOver);
  const hand=document.getElementById("hand"); hand.innerHTML="";
  state.hand.forEach(()=>{ const c=document.createElement("div"); c.className="card"; hand.appendChild(c); });
  const slots=document.getElementById("questSlots"); slots.innerHTML="";
  quests.forEach((q,i)=>{
    const box=document.createElement("div");
    box.className="panel-box"+(state.selectedQuest===i?" active":"");
    box.innerHTML=`<div class="label">${q.name}<br>${q.progress}/${q.needed}</div>`;
    box.onclick=()=>{ state.selectedQuest=i; updateUI(); };
    slots.appendChild(box);
    createPanelWeather(box);
  });
}
function checkEnd() {
  if(state.whiteSwords>=12 && state.whiteSwords>state.blackSwords) endGame(true,"The Citadel holds!");
  else if(state.blackSwords>=7) endGame(false,"Too many black swords.");
  else if(state.siege>=12) endGame(false,"The Citadel is overrun.");
}
function endGame(win,msg) {
  state.gameOver=true; log(msg, win?"win":"lose");
  showModal(win?"VICTORY":"DEFEAT", msg); updateUI();
}
function showModal(t,x){ document.getElementById("modalTitle").textContent=t; document.getElementById("modalText").textContent=x; document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }

function doProgress() {
  if(state.phase!=="progress"||state.gameOver) return;
  const r=Math.floor(Math.random()*3);
  if(r===0){ state.siege++; log(`+1 Siege (${state.siege})`); }
  else if(r===1){ state.blackSwords++; log(`+1 Black Sword (${state.blackSwords})`); }
  else { state.hand.push({type:"black"}); log("Drew Black card."); }
  state.phase="heroic"; updateUI(); checkEnd();
}
function doHeroic(action) {
  if(state.phase!=="heroic"||state.gameOver) return;
  if(action==="play") {
    const whites=state.hand.filter(c=>c.type==="white").length;
    if(whites<2 || state.selectedQuest===null){ log("Need 2 white cards + selected quest."); return; }
    let removed=0;
    state.hand=state.hand.filter(c=>c.type!=="white"||removed++>=2);
    const q=quests[state.selectedQuest];
    q.progress+=2;
    log(`${q.name}: ${q.progress}/${q.needed}`);
    if(q.progress>=q.needed){ state.whiteSwords++; q.progress=0; log(`${q.name} done! +1 White.`, "win"); }
  } else if(action==="draw") {
    state.hand.push({type:"white"},{type:"white"}); log("Drew 2 White.");
  }
  state.phase="progress"; state.turn++; updateUI(); checkEnd();
}

buildDefenders();
state.hand=[{type:"white"},{type:"white"},{type:"white"},{type:"white"},{type:"white"}];
document.getElementById("boardBg").style.backgroundImage="linear-gradient(160deg,#1a1510 0%,#2a2218 50%,#0c0a08 100%)";
log("The shadows gather. Defend the Citadel.");
updateUI();
weatherLoop();
</script>
</body>
</html>
